<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">Streams AIO — modifica in locale, conserva su GitHub</title>
  <desc id="desc">Configurazione pubblica sincronizzata ogni circa quindici minuti, secret in Infisical e cinque release di backup cifrate con age.</desc>
