- Sistema:
  - CPU della VM:
      widget:
        type: glances
        url: http://homepage-glances:61208
        version: 4
        metric: cpu
        chart: true
        refreshInterval: 5000
        pointsLimit: 20
  - Memoria della VM:
      widget:
        type: glances
        url: http://homepage-glances:61208
        version: 4
        metric: memory
        chart: true
        refreshInterval: 5000
        pointsLimit: 20
  - Disco dello stack:
      widget:
        type: glances
        url: http://homepage-glances:61208
        version: 4
        metric: fs:/
        chart: false
        refreshInterval: 5000
        pointsLimit: 20
- Prestazioni:
  - Carico medio della VM:
      widget:
        type: customapi
        url: http://homepage-glances:61208/api/4/load
        refreshInterval: 5000
        mappings:
        - field: min1
          label: 1 min
          format: float
        - field: min5
          label: 5 min
          format: float
        - field: min15
          label: 15 min
          format: float
        - field: cpucore
          label: vCPU
          format: number
  - Memoria swap:
      widget:
        type: customapi
        url: http://homepage-glances:61208/api/4/memswap
        refreshInterval: 5000
        mappings:
        - field: used
          label: Usata
          format: bytes
        - field: total
          label: Totale
          format: bytes
        - field: percent
          label: Utilizzo
          format: float
          suffix: '%'
  - Attivita del disco:
      widget:
        type: glances
        url: http://homepage-glances:61208
        version: 4
        chart: true
        refreshInterval: 5000
        pointsLimit: 30
        metric: disk:sda
