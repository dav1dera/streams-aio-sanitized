# I 23 collegamenti provengono dal template pubblico Honey. # indica un URL da completare.
- Sistema:
  - CPU della VM:
      widget:
        type: glances
        url: http://homepage-glances:61208
        version: 4
        metric: cpu
        chart: true
        refreshInterval: 5000
        pointsLimit: 20
  - Memoria della VM:
      widget:
        type: glances
        url: http://homepage-glances:61208
        version: 4
        metric: memory
        chart: true
        refreshInterval: 5000
        pointsLimit: 20
  - Disco dello stack:
      widget:
        type: glances
        url: http://homepage-glances:61208
        version: 4
        metric: fs:/
        chart: false
        refreshInterval: 5000
        pointsLimit: 20
