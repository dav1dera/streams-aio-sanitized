name: Public stack sync safety
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  public-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install 'PyYAML==6.0.3'
      - run: python3 -B -m unittest discover -s tests -p 'test_public_*.py' -v
      - run: python3 -m py_compile scripts/sync-public-stack.py scripts/public_export.py scripts/install-public-sync-policy.py
      - run: bash -n scripts/verify-public-sync-systemd.sh
