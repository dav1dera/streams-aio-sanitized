name: Public stack sync safety
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  public-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install POSIX ACL test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y acl
      - run: python3 -m pip install -r scripts/requirements-public-sync.txt
      - run: python3 -B -m unittest discover -s tests -p 'test_public_*.py' -v
      - run: python3 -m py_compile scripts/sync-public-stack.py scripts/public_export.py scripts/install-public-sync-policy.py scripts/install-local-guides.py
      - run: bash -n scripts/verify-public-sync-systemd.sh
  recovery-preparation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install -r scripts/requirements-dr.txt
      - run: python3 -B -m unittest discover -s tests -p 'test_agent_mappings.py' -v
      - run: python3 -B -m unittest discover -s tests -p 'test_agent_template_transform.py' -v
      - run: python3 -B -m unittest discover -s tests -p 'test_local_config_contract.py' -v
      - run: python3 -B -m unittest discover -s tests -p 'test_local_agent_mappings.py' -v
      - run: python3 -B -m unittest discover -s tests -p 'test_aio_dr.py' -v
      - run: python3 -B tests/check_npm_prepare.py
      - run: node --experimental-vm-modules tests/check_npm_helper.mjs
      - name: Verify generic service-state recovery fixtures
        run: python3 -B -m unittest discover -s tests -p 'test_fresh_service_state.py' -v
      - run: python3 -B tests/test_fresh_tree.py

